<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Reputação - Ebox Connect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      background: #0f0f0f;
      color: white;
    }

    #sidebar-container {
      width: 220px;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .rep-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rep-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .rep-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .bar {
      width: 40px;
      height: 8px;
      border-radius: 5px;
      opacity: 0.3;
    }

    .bar.active {
      opacity: 1;
    }

    .red { background: #e74c3c; }
    .orange { background: #e67e22; }
    .yellow { background: #f1c40f; }
    .lightgreen { background: #a3d977; }
    .green { background: #2ecc71; }

    .rep-sub {
      font-size: 12px;
      color: #aaa;
    }

    .rep-stats {
      display: flex;
      gap: 40px;
      text-align: center;
    }

    .rep-stats strong {
      font-size: 18px;
    }

    .rep-stats span {
      font-size: 12px;
      color: #aaa;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .mini-card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
    }

    .mini-title {
      margin-bottom: 10px;
      font-weight: bold;
    }

    .mini-value {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .ok { color: #2ecc71; }
    .warn { color: #f1c40f; }
    .bad { color: #e74c3c; }

    .mini-sub {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- CONTEÚDO -->
<div class="main">
  <div class="title">Reputação do vendedor</div>

  <div class="card">
    <div class="rep-header">
      <div>
        <div class="rep-title" id="nickname">Carregando...</div>

        <div class="rep-bar">
          <div class="bar red"></div>
          <div class="bar orange"></div>
          <div class="bar yellow"></div>
          <div class="bar lightgreen"></div>
          <div class="bar green active"></div>
        </div>

        <div class="rep-sub">Você aparece assim para os compradores</div>
      </div>

      <div class="rep-stats">
        <div>
          <strong id="total">0</strong><br>
          <span>Vendas</span>
        </div>

        <div>
          <strong id="completed">0</strong><br>
          <span>Concluídas</span>
        </div>

        <div>
          <strong id="canceled">0</strong><br>
          <span>Canceladas</span>
        </div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="mini-card">
      <div class="mini-title">Reclamações</div>
      <div class="mini-value ok" id="claims">0%</div>
      <div class="mini-sub">Abaixo do limite</div>
    </div>

    <div class="mini-card">
      <div class="mini-title">Mediações</div>
      <div class="mini-value ok">0%</div>
      <div class="mini-sub">Dentro do esperado</div>
    </div>

    <div class="mini-card">
      <div class="mini-title">Cancelamentos</div>
      <div class="mini-value warn" id="cancelRate">0%</div>
      <div class="mini-sub">Monitorar</div>
    </div>

    <div class="mini-card">
      <div class="mini-title">Envios</div>
      <div class="mini-value ok">OK</div>
      <div class="mini-sub">Sem atrasos</div>
    </div>
  </div>
</div>

<script>
// 🔥 SIDEBAR
fetch("/partials/sidebar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("sidebar-container").innerHTML = data;

    const currentPath = window.location.pathname;
    const links = document.querySelectorAll("#sidebar-container .menu a");

    links.forEach(link => {
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      }
    });
  });

// 🔥 DADOS REPUTAÇÃO
async function loadSellerInfo() {
  const res = await fetch('/api/seller-info');
  const data = await res.json();

  document.getElementById("nickname").innerText = data.nickname;

  const total = data.transactions?.total || 0;
  const completed = data.transactions?.completed || 0;
  const canceled = data.transactions?.canceled || 0;
  const claims = data.transactions?.claims || 0;

  document.getElementById("total").innerText = total;
  document.getElementById("completed").innerText = completed;
  document.getElementById("canceled").innerText = canceled;

  const cancelRate = total ? ((canceled / total) * 100).toFixed(2) : 0;
  document.getElementById("cancelRate").innerText = cancelRate + "%";

  const claimRate = total ? ((claims / total) * 100).toFixed(2) : 0;
  document.getElementById("claims").innerText = claimRate + "%";
}

loadSellerInfo();
</script>

</body>
</html>
