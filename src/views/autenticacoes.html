<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Autenticações - Ebox Connect</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }

    body { display:flex; background:#0f0f0f; color:white; }

    #sidebar-container {
      width:220px;
      flex-shrink:0;
    }

    .main { flex:1; padding:40px; }

    .title { font-size:28px; font-weight:bold; }
    .subtitle { color:#aaa; margin-bottom:20px; }

    .tabs { display:flex; gap:10px; margin-bottom:20px; }

    .tab {
      padding:10px 16px;
      border-radius:8px;
      background:#1a1a1a;
      color:#aaa;
    }

    .tab.active {
      background:#ff9900;
      color:black;
      font-weight:bold;
    }

    .folder {
      background:#141414;
      padding:20px;
      border-radius:12px;
    }

    .folder-header {
      display:flex;
      justify-content:space-between;
      margin-bottom:20px;
    }

    .btn-connect {
      background:#ff9900;
      color:black;
      padding:10px 18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .accounts {
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .card {
      background:#1a1a1a;
      padding:20px;
      border-radius:12px;
      width:320px;
    }

    .card-header {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .card-title { flex:1; font-weight:bold; }

    .status {
      background:#2ecc71;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
    }

    .card-id {
      font-size:13px;
      color:#aaa;
      margin-bottom:10px;
    }

    .card-extra {
      font-size:13px;
      color:#aaa;
      margin-bottom:15px;
      line-height:1.6;
    }

    .actions { display:flex; flex-direction:column; gap:10px; }

    .btn {
      padding:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-sync {
      background:#ff9900;
      color:black;
    }

    .btn-orders {
      background:#3498db;
      color:white;
    }

    .edit { cursor:pointer; color:#ff9900; }
    .delete { cursor:pointer; color:#ff4d4d; }

    #modal {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    .modal-box {
      background:#1a1a1a;
      padding:25px;
      border-radius:12px;
      width:300px;
    }

    .modal-box input {
      width:100%;
      margin-bottom:10px;
      padding:8px;
      border-radius:6px;
      border:none;
    }

    .modal-actions {
      display:flex;
      gap:10px;
    }

    .modal-actions button {
      flex:1;
      padding:10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .save { background:#ff9900; }
    .cancel { background:#333; color:white; }
  </style>
</head>

<body>

<div id="sidebar-container"></div>

<div class="main">
  <div class="title">Autenticações</div>
  <div class="subtitle">Gerencie suas contas conectadas</div>

  <div class="tabs">
    <div class="tab active">Mercado Livre</div>
  </div>

  <div class="folder">
    <div class="folder-header">
      <div>
        <strong>Mercado Livre</strong><br>
        <span style="color:#888;">Conecte e gerencie suas contas</span>
      </div>

      <button class="btn-connect" onclick="location.href='/auth/mercadolivre'">
        + Conectar conta
      </button>
    </div>

    <div class="accounts" id="accounts"></div>
  </div>
</div>

<div id="modal">
  <div class="modal-box">
    <h3 style="margin-bottom:10px;">Editar conta</h3>

    <input id="inputName" placeholder="Nome">
    <input id="inputZip" placeholder="CEP">
    <input id="inputTax" placeholder="Taxa (%)">

    <div class="modal-actions">
      <button class="save" onclick="salvar()">Salvar</button>
      <button class="cancel" onclick="fechar()">Cancelar</button>
    </div>
  </div>
</div>

<script>
let contaAtual = null;

function abrir(conta){
  contaAtual = conta;
  inputName.value = conta.name || "";
  inputZip.value = conta.company_zipcode || "";
  inputTax.value = conta.tax_rate || "";
  modal.style.display = "flex";
}

function fechar(){
  modal.style.display = "none";
}

async function salvar() {
  const res = await fetch('/api/update-account-name', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      id: contaAtual.id,
      name: inputName.value,
      zipcode: inputZip.value,
      tax: inputTax.value
    })
  });

  alert("Salvo!");
  location.reload();
}

window.onload = async () => {
  const res = await fetch('/api/ml-accounts');
  const contas = await res.json();

  contas.forEach(conta => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-header">
        <div class="card-title">${conta.name || "Conta ML"}</div>
        <div class="edit">✏️</div>
        <div class="status">Conectado</div>
      </div>

      <div class="card-id">ID: ${conta.ml_user_id}</div>

      <div class="card-extra">
        📍 CEP: ${conta.company_zipcode || "-"}<br>
        💰 Taxa: ${conta.tax_rate || "-"}%
      </div>

      <div class="actions">
        <button class="btn btn-sync">🔄 Sincronizar produtos</button>
        <button class="btn btn-orders">📦 Sincronizar pedidos</button>
        <div class="delete">🗑️ Desconectar</div>
      </div>
    `;

    div.querySelector(".edit").onclick = () => abrir(conta);

    div.querySelector(".btn-sync").onclick = async () => {
      await fetch('/api/sync-products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accountId: conta.id })
      });
      alert("Produtos sincronizados!");
    };

    div.querySelector(".btn-orders").onclick = async () => {
      await fetch('/api/sync-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accountId: conta.id })
      });
      alert("Pedidos sincronizados!");
    };

    document.getElementById("accounts").appendChild(div);
  });
};

// 🔥 CARREGA SIDEBAR
fetch("/partials/sidebar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("sidebar-container").innerHTML = data;

    const currentPath = window.location.pathname;
    const links = document.querySelectorAll("#sidebar-container .menu a");

    links.forEach(link => {
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>

</body>
</html>
