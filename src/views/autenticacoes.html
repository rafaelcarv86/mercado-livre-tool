<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Autenticações - Ebox Connect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      background: #0f0f0f;
      color: white;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: #111;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      width: 140px;
      margin-bottom: 30px;
    }

    .menu a {
      display: block;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
    }

    .menu a.active {
      background: #ff9900;
      color: black;
      font-weight: bold;
    }

    .logout {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      color: #aaa;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .market-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .market-title {
      font-size: 20px;
      font-weight: bold;
    }

    .market-sub {
      color: #888;
      font-size: 14px;
    }

    .btn-connect {
      background: #ff9900;
      color: black;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .accounts {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      width: 260px;
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-weight: bold;
    }

    .card-id {
      font-size: 13px;
      color: #aaa;
      margin-top: 5px;
    }

    .status {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #2ecc71;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .edit {
      cursor: pointer;
      color: #ff9900;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div>
      <img src="/assets/logo.png" class="logo" />

      <div class="menu">
        <a href="/dashboard">Dashboard</a>
        <a href="#">Análise</a>
        <a href="/autenticacoes" class="active">Autenticações</a>
      </div>
    </div>

    <div class="logout">Sair</div>
  </div>

  <div class="main">
    <div class="title">Autenticações</div>
    <div class="subtitle">Gerencie suas contas conectadas</div>

    <div class="market-header">
      <div>
        <div class="market-title">Mercado Livre</div>
        <div class="market-sub">Conecte e gerencie suas contas</div>
      </div>

      <button class="btn-connect" onclick="window.location.href='/auth/mercadolivre'">
        + Conectar conta
      </button>
    </div>

    <!-- 🔥 AQUI FICA DINÂMICO -->
    <div class="accounts" id="accounts"></div>

  </div>

<script>
async function carregarContas() {
  try {
    const res = await fetch('/api/ml-accounts');
    const contas = await res.json();

    const container = document.getElementById('accounts');
    container.innerHTML = '';

    contas.forEach(conta => {
      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <div class="status">Conectado</div>

        <div class="card-header">
          <div class="card-title">${conta.name || 'Conta ML'}</div>
          <div class="edit">✏️</div>
        </div>

        <div class="card-id">ID: ${conta.ml_user_id}</div>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    console.error("Erro ao carregar contas:", err);
  }
}

carregarContas();
</script>

</body>
</html>
