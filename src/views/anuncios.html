<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anúncios - Ebox Connect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      background: #0f0f0f;
      color: white;
    }

    #sidebar-container {
      width: 220px;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      width: 260px;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      margin-bottom: 8px;
      height: 40px;
      overflow: hidden;
    }

    .price {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .meta {
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR DINÂMICO -->
  <div id="sidebar-container"></div>

  <!-- CONTEÚDO -->
  <div class="main">
    <div class="title">Anúncios</div>
    <div class="subtitle">Seus produtos importados do Mercado Livre</div>

    <div class="products" id="products"></div>
  </div>

<script>
// 🔥 SIDEBAR
fetch("/partials/sidebar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("sidebar-container").innerHTML = data;

    const currentPath = window.location.pathname;
    const links = document.querySelectorAll("#sidebar-container .menu a");

    links.forEach(link => {
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      }
    });
  });

// 🔥 PRODUTOS
async function loadProducts() {
  const res = await fetch('/api/products');
  const data = await res.json();

  const container = document.getElementById('products');
  container.innerHTML = '';

  data.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';

    div.innerHTML = `
      <img src="${p.thumbnail}" />
      <div class="card-title">${p.title}</div>
      <div class="price">💰 R$ ${p.price}</div>
      <div class="meta">💸 Comissão: R$ ${p.commission_fee || 0}</div>
    `;

    container.appendChild(div);
  });
}

loadProducts();
</script>

</body>
</html>
