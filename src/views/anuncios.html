<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anúncios - Ebox Connect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      background: #0f0f0f;
      color: white;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: #111;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      width: 140px;
      margin-bottom: 30px;
    }

    .menu a {
      display: block;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
    }

    .menu a.active {
      background: #ff9900;
      color: black;
      font-weight: bold;
    }

    .logout {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      color: #aaa;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      width: 260px;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      margin-bottom: 8px;
      height: 40px;
      overflow: hidden;
    }

    .price {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .meta {
      font-size: 13px;
      color: #aaa;
    }

  </style>
</head>

<body>

  <!-- SIDEBAR (SEU PADRÃO) -->
  <div class="sidebar">
    <div>
      <img src="/assets/logo.png" class="logo" />

      <div class="menu">
        <a href="/dashboard">Dashboard</a>
        <a href="/anuncios" class="active">Anúncios</a>
        <a href="/reputacao">Reputação</a>
        <a href="/autenticacoes">Autenticações</a>
      </div>
    </div>

    <div class="logout">Sair</div>
  </div>

  <!-- CONTEÚDO -->
  <div class="main">
    <div class="title">Anúncios</div>
    <div class="subtitle">Seus produtos importados do Mercado Livre</div>

    <div class="products" id="products"></div>
  </div>

<script>
async function loadProducts() {
  const res = await fetch('/api/products');
  const data = await res.json();

  const container = document.getElementById('products');
  container.innerHTML = '';

  data.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';


    div.innerHTML = `
      <img src="${p.thumbnail}" />
      <div class="card-title">${p.title}</div>

      <div class="price">💰 R$ ${p.price}</div>

      <div class="meta">💸 Comissão: R$ ${p.commission_fee || 0}</div>
    `;

    container.appendChild(div);
  });
}

loadProducts();
</script>

</body>
</html>
